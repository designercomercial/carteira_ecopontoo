<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha carteirinha – EcoPonto</title>
  <meta name="description" content="Carteirinha digital do EcoPonto da Prefeitura de Boa Vista.">
  <script>
    // Aplica o tema salvo antes de pintar a página, para não piscar.
    try {
      var t = localStorage.getItem("tema");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para a carteirinha</a>

  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-header__logo" aria-hidden="true">
        <!-- Lucide: recycle -->
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/>
          <path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/>
          <path d="m14 16-3 3 3 3"/>
          <path d="M8.293 13.596 7.196 9.5 3.1 10.598"/>
          <path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/>
          <path d="m13.378 9.633 4.096 1.098 1.097-4.096"/>
        </svg>
      </span>
      <div class="site-header__titles">
        <h1 class="site-header__title">Minha carteirinha</h1>
        <p class="site-header__subtitle">EcoPonto · Prefeitura de Boa Vista</p>
      </div>
      <button type="button" class="icon-button" id="theme-toggle" aria-label="Usar tema escuro">
        <!-- Lucide: moon -->
        <svg class="icon" data-icon="moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <!-- Lucide: sun -->
        <svg class="icon" data-icon="sun" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/><path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/><path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>
    </div>
    <div class="brand-stripe" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  </header>

  <main id="conteudo" class="page" tabindex="-1">
    <article class="card" aria-labelledby="holder-name">
      <div class="card__top">
        <span class="status">
          <!-- Lucide: circle-check -->
          <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
          </svg>
          Carteirinha ativa
        </span>
        <span id="profile-badge" class="badge"></span>
      </div>

      <h2 class="holder__name" id="holder-name"></h2>

      <dl class="details">
        <div>
          <dt>Número</dt>
          <dd class="code" id="card-number"></dd>
        </div>
        <div>
          <dt>Válida até</dt>
          <dd id="card-valid"></dd>
        </div>
      </dl>

      <figure class="qr">
        <div class="qr__frame" id="qr-frame"></div>
        <figcaption class="qr__caption">
          <!-- Lucide: scan-line -->
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <path d="M7 12h10"/>
          </svg>
          Mostre este QR ao atendente do EcoPonto.
        </figcaption>
      </figure>
    </article>

    <p class="help">
      Se o QR não ler, diga o número da carteirinha ao atendente.
    </p>
  </main>

  <!-- Gerador de QR (SVG, sem rede para gerar) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
